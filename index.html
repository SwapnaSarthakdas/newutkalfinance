<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Utkal Finance Limited | Certified by Govt. of India</title>
  <meta name="description"
    content="New Utkal Finance Limited (Reg. No: U64199OD2026PLC054968) provides certified financial management, secure loans, high-yield deposits, and member banking solutions." />
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <script>
    // Global error listener to prevent blank white screen
    window.addEventListener('error', function (e) {
      console.error('Captured window error:', e.error || e.message);
      var banner = document.getElementById('global-err-banner');
      if (!banner && document.body) {
        banner = document.createElement('div');
        banner.id = 'global-err-banner';
        banner.style.cssText = 'position:fixed;bottom:16px;left:16px;right:16px;max-width:500px;margin:0 auto;background:#1e293b;color:#f8fafc;padding:16px 20px;border-radius:12px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);border:1px solid #475569;z-index:99999;font-family:system-ui,sans-serif;font-size:13px;';
        banner.innerHTML = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;"><span style="font-size:18px;">⚠️</span><strong style="color:#f59e0b;font-size:14px;">Browser Script Notice</strong></div>' +
          '<div style="color:#cbd5e1;margin-bottom:12px;word-break:break-word;">' + (e.message || 'An unexpected script error occurred.') + '</div>' +
          '<div style="display:flex;gap:8px;">' +
          '<button onclick="localStorage.clear();sessionStorage.clear();window.location.hash=\'\';window.location.reload();" style="background:#10b981;color:white;border:none;padding:6px 12px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:12px;">Reset Data & Reload</button>' +
          '<button onclick="this.parentElement.parentElement.remove();" style="background:#334155;color:#e2e8f0;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;">Dismiss</button>' +
          '</div>';
        document.body.appendChild(banner);
      }
    });
  </script>
</head>

<body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-finance-600 selection:text-white">
  <div id="root">
    <div
      style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#ffffff;font-family:system-ui,-apple-system,sans-serif;">
      <div style="text-align:center;padding:24px;">
        <div
          style="width:44px;height:44px;border:4px solid #10b981;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;">
        </div>
        <h2 style="font-size:20px;font-weight:800;margin:0 0 6px;letter-spacing:-0.02em;color:#ffffff;">New Utkal
          Finance Limited</h2>
        <p style="font-size:13px;color:#94a3b8;margin:0;">Certified by Govt. of India &bull; Loading portal...</p>
      </div>
    </div>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg)
        }
      }
    </style>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
